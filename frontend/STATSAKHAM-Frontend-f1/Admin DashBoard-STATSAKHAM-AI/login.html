<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | STATSAKHAM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body class="login-page">
<div class="login-card">
  <div class="login-brand"><div class="brand-mark"><i class="bi bi-bar-chart-fill"></i></div>STATSAKHAM</div>
  <p class="muted mb-4">AI-Powered Skill Intelligence & Personalized Learning Platform</p>
  <form id="loginForm">
    <div class="mb-3"><label class="form-label">Email / Employee ID</label><input name="username" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
    <div class="d-flex justify-content-between align-items-center mb-4"><div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">Remember me</label></div><a href="#" onclick="toast('Password reset must be requested from your administrator.','info');return false;">Forgot password?</a></div>
    <button class="btn btn-brand w-100" id="loginBtn">Sign In</button>
  </form>
  <div class="demo-note mt-3 small text-muted">
    Demo accounts: <b>admin@statsaksham.gov.in</b> / Admin@123 &nbsp;•&nbsp;
    <b>trainer@statsaksham.gov.in</b> / Trainer@123
  </div>
</div>
<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/app.js"></script>
<script>
// If already logged in as admin/trainer, skip straight to the dashboard.
if(getToken()){ location.href = "dashboard.html"; }

document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();const btn=document.getElementById("loginBtn");btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';
 try{
   const payload=Object.fromEntries(new FormData(e.target));
   const r=await postData("/auth/login",payload);
   if(!["admin","trainer"].includes(r.user.role)){
     toast("This portal is for admin/trainer accounts. Employees should use the Employee Learning Portal.","danger");
     return;
   }
   localStorage.setItem(TOKEN_KEY, r.token || "");
   localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(r.user));
   toast("Login successful");
   setTimeout(()=>location.href="dashboard.html",300);
 }
 catch(err){toast(err.message || "Invalid credentials","danger")}
 finally{btn.disabled=false;btn.textContent="Sign In"}
});
</script></body></html>
